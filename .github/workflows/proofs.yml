# NEOLABS evidence packs: verify, sign, time-stamp, attest. Runs in the PUBLIC proof repository on standard
# GitHub-hosted runners (free for a public repository). No inference key, no model call, no private file. The only
# secrets are the deposit tokens of Zenodo and of its sandbox, used by manual runs only (ADR-0095).
# Each external proof is recorded in packs/<test>/publication-index.json with its real state; a provider is never
# published twice for one manifest (cli.mjs plan), so a run interrupted by a provider failure can simply run again.
name: proofs
on:
  push:
    branches: [main]
    paths: ['packs/**', 'verify/**', '.github/workflows/proofs.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      archive:
        description: 'Ask Software Heritage to archive this repository (a permanent public record): type yes'
        required: false
        default: 'no'
      pack:
        description: 'Folder under packs/ that the two inputs below act on'
        required: false
        default: 'test-2'
      rehearse:
        description: 'Rehearsal, nothing permanent and nothing committed: drand self-test and a deposit on the Zenodo SANDBOX: type yes'
        required: false
        default: 'no'
      doi:
        description: 'Deposit the pack on Zenodo for a PERMANENT public record and DOI (Founder go only): type PERMANENT'
        required: false
        default: 'no'
      dataset:
        description: 'Publish the pack as a PUBLIC Hugging Face dataset (Founder go only): type PUBLIC'
        required: false
        default: 'no'
      preregister:
        description: 'Deposit protocols/<pack>.md in a PUBLIC OSF project, before the test runs (Founder go only): type PUBLIC'
        required: false
        default: 'no'
  schedule:
    - cron: '17 */6 * * *'   # follows the proofs that are still pending (OpenTimestamps confirmation)

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests of the scorer and of the checks (no network)
        run: node --test verify/test/*.test.mjs
      - name: Verify every pack (a discrepancy fails the publication)
        run: |
          set -euo pipefail
          for pack in packs/*/; do echo "== $pack"; node verify/cli.mjs verify "$pack"; done

  prove:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commits the proofs and the publication index
      id-token: write        # Sigstore keyless signature with the identity of this workflow
      attestations: write    # GitHub artifact attestation of the scorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: sigstore/cosign-installer@v3
      - name: OpenTimestamps client
        run: pip install --quiet opentimestamps-client
      - name: Sign and time-stamp each manifest
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/proofs.yml@refs/heads/main
        run: |
          set -uo pipefail
          now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          for pack in packs/*/; do
            pack="${pack%/}"; mkdir -p "$pack/proofs"
            node verify/cli.mjs canonical "$pack/manifest.json" > "$pack/proofs/manifest.jcs"
            digest="$(node verify/cli.mjs digest "$pack/manifest.json")"
            echo "== $pack manifest $digest"

            # Sigstore: Fulcio certificate for this workflow, signature and inclusion in the Rekor log.
            if [ "$(node verify/cli.mjs plan "$pack" 'Sigstore (Fulcio, Rekor)')" != skip ]; then
              if cosign sign-blob --yes --bundle "$pack/proofs/manifest.sigstore.json" "$pack/proofs/manifest.jcs" >/dev/null \
                 && cosign verify-blob --bundle "$pack/proofs/manifest.sigstore.json" --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$pack/proofs/manifest.jcs"; then
                node verify/cli.mjs proof "$pack" "{\"provider\":\"Sigstore (Fulcio, Rekor)\",\"group\":\"integrity\",\"status\":\"verified\",\"kind\":\"sigstore-bundle\",\"file\":\"proofs/manifest.sigstore.json\",\"detail\":\"Signed by the workflow $IDENTITY; inclusion in Rekor verified.\",\"verify_command\":\"cosign verify-blob --bundle proofs/manifest.sigstore.json --certificate-identity $IDENTITY --certificate-oidc-issuer https://token.actions.githubusercontent.com proofs/manifest.jcs\",\"checked_at\":\"$(now)\"}"
              else
                node verify/cli.mjs proof "$pack" "{\"provider\":\"Sigstore (Fulcio, Rekor)\",\"group\":\"integrity\",\"status\":\"insufficient\",\"detail\":\"The signature could not be produced or verified on the last run; it is tried again on the next one.\",\"checked_at\":\"$(now)\"}"
              fi
            fi

            # FreeTSA: a free RFC 3161 time-stamp of the manifest, verified against FreeTSA's own certificates.
            if [ "$(node verify/cli.mjs plan "$pack" 'FreeTSA')" != skip ]; then
              if openssl ts -query -data "$pack/proofs/manifest.jcs" -sha256 -cert -no_nonce -out /tmp/req.tsq \
                 && curl -fsS --retry 3 --max-time 60 -H 'Content-Type: application/timestamp-query' --data-binary @/tmp/req.tsq https://freetsa.org/tsr -o "$pack/proofs/freetsa.tsr" \
                 && curl -fsS --retry 3 --max-time 60 https://freetsa.org/files/cacert.pem -o "$pack/proofs/freetsa-cacert.pem" \
                 && curl -fsS --retry 3 --max-time 60 https://freetsa.org/files/tsa.crt -o "$pack/proofs/freetsa-tsa.crt" \
                 && openssl ts -verify -data "$pack/proofs/manifest.jcs" -in "$pack/proofs/freetsa.tsr" -CAfile "$pack/proofs/freetsa-cacert.pem" -untrusted "$pack/proofs/freetsa-tsa.crt"; then
                node verify/cli.mjs proof "$pack" "{\"provider\":\"FreeTSA\",\"group\":\"date\",\"status\":\"verified\",\"file\":\"proofs/freetsa.tsr\",\"must_contain_manifest_digest\":true,\"detail\":\"RFC 3161 time-stamp of the manifest by FreeTSA (a free, community authority; complementary to the DigiCert time-stamp of the ledger).\",\"verify_command\":\"openssl ts -verify -data proofs/manifest.jcs -in proofs/freetsa.tsr -CAfile proofs/freetsa-cacert.pem -untrusted proofs/freetsa-tsa.crt\",\"checked_at\":\"$(now)\"}"
              else
                rm -f "$pack/proofs/freetsa.tsr"
                node verify/cli.mjs proof "$pack" "{\"provider\":\"FreeTSA\",\"group\":\"date\",\"status\":\"insufficient\",\"detail\":\"FreeTSA did not answer or its token did not verify on the last run; it is tried again on the next one.\",\"checked_at\":\"$(now)\"}"
              fi
            fi

            # OpenTimestamps: submitted once to the public calendars, then followed until a Bitcoin block confirms it.
            plan="$(node verify/cli.mjs plan "$pack" 'OpenTimestamps (Bitcoin)')"
            if [ "$plan" = create ] && [ ! -f "$pack/proofs/manifest.jcs.ots" ]; then
              ots stamp "$pack/proofs/manifest.jcs" || true
            fi
            if [ "$plan" != skip ] && [ -f "$pack/proofs/manifest.jcs.ots" ]; then
              ots upgrade "$pack/proofs/manifest.jcs.ots" || true
              rm -f "$pack/proofs/manifest.jcs.ots.bak"
              height="$(ots info "$pack/proofs/manifest.jcs.ots" 2>/dev/null | sed -n 's/.*BitcoinBlockHeaderAttestation(\([0-9]*\)).*/\1/p' | head -1)"
              if [ -n "$height" ]; then
                node verify/cli.mjs proof "$pack" "{\"provider\":\"OpenTimestamps (Bitcoin)\",\"group\":\"date\",\"status\":\"verified\",\"file\":\"proofs/manifest.jcs.ots\",\"must_contain_manifest_digest\":true,\"detail\":\"The proof commits the manifest to Bitcoin block $height. Check it on your own node: ots verify proofs/manifest.jcs.ots\",\"url\":\"https://blockstream.info/block-height/$height\",\"checked_at\":\"$(now)\"}"
              else
                node verify/cli.mjs proof "$pack" "{\"provider\":\"OpenTimestamps (Bitcoin)\",\"group\":\"date\",\"status\":\"pending\",\"file\":\"proofs/manifest.jcs.ots\",\"must_contain_manifest_digest\":true,\"detail\":\"Submitted to the public calendars; awaiting confirmation in a Bitcoin block.\",\"checked_at\":\"$(now)\"}"
              fi
            fi
          done
      - name: The public draw (drand), for a pack whose manifest fixed a round
        # The manifest names a FUTURE round before the campaign is sealed. The workflow notes that it saw the manifest
        # before the round, then, once the League of Entropy has published the round, verifies its signature (BLS12-381,
        # a pinned @noble/curves) and records the sample it draws. A round seen only after its time is never "verified".
        run: |
          set -uo pipefail
          now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          provider='drand (League of Entropy)'
          for pack in packs/*/; do
            pack="${pack%/}"
            round="$(jq -r '.campaign.public_sample.round // empty' "$pack/manifest.json")"
            size="$(jq -r '.campaign.public_sample.size // empty' "$pack/manifest.json")"
            chain="$(jq -r '.campaign.public_sample.chain_hash // empty' "$pack/manifest.json")"
            if [ -z "$round" ] || [ -z "$size" ] || ! printf '%s' "$chain" | grep -Eq '^[0-9a-f]{64}$'; then continue; fi
            if [ "$(node verify/cli.mjs plan "$pack" "$provider")" = skip ]; then continue; fi
            mkdir -p "$pack/proofs"
            seen="$(jq -r --arg p "$provider" '.proofs[]? | select(.provider == $p) | .observed_before_round_at // empty' "$pack/publication-index.json" 2>/dev/null || true)"
            if ! curl -fsS --retry 3 --max-time 60 "https://api.drand.sh/$chain/info" -o "$pack/proofs/drand-chain.json"; then
              echo "::warning::drand did not answer for $pack; the draw is followed on the next run"; rm -f "$pack/proofs/drand-chain.json"; continue
            fi
            round_time="$(date -u -d "@$(jq -r --argjson r "$round" '.genesis_time + ($r - 1) * .period' "$pack/proofs/drand-chain.json")" +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$(date -u +%s)" -lt "$(date -u -d "$round_time" +%s)" ]; then
              seen="${seen:-$(now)}"
              node verify/cli.mjs proof "$pack" "$(jq -nc --arg p "$provider" --arg s "$seen" --arg t "$round_time" --argjson r "$round" '{provider:$p,group:"sample",status:"pending",external_id:("round " + ($r|tostring)),observed_before_round_at:$s,round_time:$t,detail:("Round " + ($r|tostring) + " is not published yet (round time " + $t + "). This workflow saw the manifest in the public repository at " + $s + ", before the round.")}')" "$(now)"
              continue
            fi
            if ! curl -fsS --retry 3 --max-time 60 "https://api.drand.sh/$chain/public/$round" -o "$pack/proofs/drand-round.json"; then
              echo "::warning::round $round could not be fetched for $pack; followed on the next run"; rm -f "$pack/proofs/drand-round.json"; continue
            fi
            npm install --silent --no-save --ignore-scripts --prefix /tmp/bls @noble/curves@1.9.7 >/dev/null
            if NEOLABS_BLS_MODULE=/tmp/bls/node_modules/@noble/curves/bls12-381.js node verify/cli.mjs drand "$pack/proofs/drand-round.json" "$pack/proofs/drand-chain.json"; then
              jq -c '.results.tasks' "$pack/manifest.json" > /tmp/ids.json
              sample="$(node verify/cli.mjs sample /tmp/ids.json "$(jq -r .randomness "$pack/proofs/drand-round.json")" "$size")"
              if [ -n "$seen" ]; then status=verified; note="This workflow saw the manifest at $seen, before round time $round_time."; else status=insufficient; note="This workflow did not see the manifest before round time $round_time: the conditions of the draw are not shown as met."; fi
              node verify/cli.mjs proof "$pack" "$(jq -nc --arg p "$provider" --arg st "$status" --arg n "$note" --arg s "$seen" --arg t "$round_time" --argjson sample "$sample" '{provider:$p,group:"sample",kind:"drand-beacon",status:$st,file:"proofs/drand-round.json",chain_file:"proofs/drand-chain.json",sample:$sample,round_time:$t,detail:$n,verify_command:"npm install @noble/curves@1.9.7 && node verify/cli.mjs drand proofs/drand-round.json proofs/drand-chain.json"} + (if $s == "" then {} else {observed_before_round_at:$s} end)')" "$(now)"
            else
              node verify/cli.mjs proof "$pack" "$(jq -nc --arg p "$provider" '{provider:$p,group:"sample",kind:"drand-beacon",status:"discrepancy",file:"proofs/drand-round.json",chain_file:"proofs/drand-chain.json",detail:"The signature of the round did not verify under the public key of the chain on the last run."}')" "$(now)"
            fi
          done
      - name: Permanent record and DOI on Zenodo (Founder go only)
        # A PERMANENT public record: only on a manual run that types PERMANENT, for the pack it names, once per manifest.
        if: github.event_name == 'workflow_dispatch' && inputs.doi == 'PERMANENT'
        env:
          DEPOSIT_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          printf '%s' "$PACK" | grep -Eq '^[a-z0-9-]+$' && [ -f "packs/$PACK/manifest.json" ] || { echo "packs/$PACK is not an evidence pack"; exit 1; }
          pack="packs/$PACK"; provider='Zenodo (DataCite DOI)'
          if [ "$(node verify/cli.mjs plan "$pack" "$provider")" = skip ]; then echo "This manifest already has its DOI."; exit 0; fi
          node verify/cli.mjs verify "$pack"
          mkdir -p "$pack/proofs"
          node verify/cli.mjs deposit "$pack" https://zenodo.org/api "https://github.com/${{ github.repository }}" > "$pack/proofs/zenodo-record.json"
          node verify/cli.mjs proof "$pack" "$(jq -c '{provider:"Zenodo (DataCite DOI)",group:"provenance",status:"verified",file:"proofs/zenodo-record.json",must_name_manifest_digest:true,doi:.doi,url:("https://doi.org/" + .doi),detail:("Permanent public record of this pack, DOI " + .doi + ". The record names the fingerprint of this manifest; every uploaded file matched the checksum the repository computed.")}' "$pack/proofs/zenodo-record.json")"
      - name: Public dataset on Hugging Face (Founder go only)
        if: github.event_name == 'workflow_dispatch' && inputs.dataset == 'PUBLIC'
        env:
          DEPOSIT_TOKEN: ${{ secrets.HF_TOKEN }}
          PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          printf '%s' "$PACK" | grep -Eq '^[a-z0-9-]+$' && [ -f "packs/$PACK/manifest.json" ] || { echo "packs/$PACK is not an evidence pack"; exit 1; }
          pack="packs/$PACK"; provider='Hugging Face (dataset)'
          if [ "$(node verify/cli.mjs plan "$pack" "$provider")" = skip ]; then echo "This manifest is already published as a dataset."; exit 0; fi
          node verify/cli.mjs verify "$pack"
          mkdir -p "$pack/proofs"
          node verify/cli.mjs huggingface "$pack" "neo-ai-evaluations-$PACK" public "https://github.com/${{ github.repository }}" > "$pack/proofs/huggingface-record.json"
          node verify/cli.mjs proof "$pack" "$(jq -c '{provider:"Hugging Face (dataset)",group:"provenance",status:"verified",file:"proofs/huggingface-record.json",must_name_manifest_digest:true,url:.url,detail:("The per-task public results as an open dataset: " + .url + ". Every file was read back and has the SHA-256 of the pack.")}' "$pack/proofs/huggingface-record.json")"
      - name: Protocol of a test in a public OSF project, before the test (Founder go only)
        # The protocol is a file of this repository (protocols/<pack>.md), so it is also time-stamped by the steps
        # above. The project is public; the frozen registration is made from it by a person in OSF.
        if: github.event_name == 'workflow_dispatch' && inputs.preregister == 'PUBLIC'
        env:
          DEPOSIT_TOKEN: ${{ secrets.OSF_TOKEN }}
          PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          printf '%s' "$PACK" | grep -Eq '^[a-z0-9-]+$' && [ -f "protocols/$PACK.md" ] || { echo "protocols/$PACK.md is missing"; exit 1; }
          if [ -f "protocols/$PACK.osf.json" ]; then echo "This protocol is already deposited."; exit 0; fi
          node verify/cli.mjs osf "protocols/$PACK.md" "NEO AI Evaluations - protocol of $PACK" public > "protocols/$PACK.osf.json"
          [ "$(jq -r .sha256 "protocols/$PACK.osf.json")" = "$(sha256sum "protocols/$PACK.md" | cut -d' ' -f1)" ]
          git add "protocols/$PACK.osf.json"
          cat "protocols/$PACK.osf.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attest the provenance of the published scorer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'verify/*.mjs'
      - name: Ask Software Heritage to archive this repository
        # A permanent record: only on a manual run that asks for it (Founder's go, ADR-0092).
        if: github.event_name == 'workflow_dispatch' && inputs.archive == 'yes'
        continue-on-error: true
        run: curl -fsS --max-time 60 -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${{ github.repository }}/" | head -c 600
      - name: Verify again, then commit the proofs
        run: |
          set -euo pipefail
          for pack in packs/*/; do node verify/cli.mjs verify "$pack" || { echo 'Structure of the Sigstore bundle, for diagnosis:'; jq -c '[paths(scalars) | map(tostring) | join(".")]' "$pack/proofs/manifest.sigstore.json" || true; exit 1; }; done
          git config user.name 'neolabs-proofs[bot]'
          git config user.email 'neolabs-proofs@users.noreply.github.com'
          git add packs
          git diff --cached --quiet || { git commit -m 'Record external proofs in the publication index [skip ci]'; git push; }

  rehearse:
    # A rehearsal of the two steps that cannot be tried on a real pack without leaving a permanent trace. It commits
    # nothing and records nothing in a publication index. The sandbox of Zenodo holds test records only.
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.rehearse == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 'drand, live - the latest round of the quicknet chain verifies with the code of this repository'
        run: |
          set -euo pipefail
          chain=52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971
          npm install --silent --no-save --ignore-scripts --prefix /tmp/bls @noble/curves@1.9.7 >/dev/null
          export NEOLABS_BLS_MODULE=/tmp/bls/node_modules/@noble/curves/bls12-381.js
          node --test verify/test/*.test.mjs
          curl -fsS --retry 3 --max-time 60 "https://api.drand.sh/$chain/info" -o /tmp/chain.json
          curl -fsS --retry 3 --max-time 60 "https://api.drand.sh/$chain/public/latest" -o /tmp/round.json
          node verify/cli.mjs drand /tmp/round.json /tmp/chain.json | tee -a "$GITHUB_STEP_SUMMARY"
          # The same round with one bit of its randomness changed must be refused.
          jq '.randomness = ("0" * 64)' /tmp/round.json > /tmp/forged.json
          if node verify/cli.mjs drand /tmp/forged.json /tmp/chain.json; then echo 'a forged round was accepted'; exit 1; fi
      - name: 'Zenodo SANDBOX - deposit the pack, check every checksum, read the test DOI'
        env:
          DEPOSIT_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          printf '%s' "$PACK" | grep -Eq '^[a-z0-9-]+$' && [ -f "packs/$PACK/manifest.json" ] || { echo "packs/$PACK is not an evidence pack"; exit 1; }
          node verify/cli.mjs deposit "packs/$PACK" https://sandbox.zenodo.org/api "https://github.com/${{ github.repository }}" > /tmp/record.json
          [ "$(jq -r .manifest_sha256 /tmp/record.json)" = "$(node verify/cli.mjs digest "packs/$PACK/manifest.json")" ]
          { echo '### Zenodo sandbox rehearsal (a test record, not a permanent identifier)'; jq -r '"- test DOI: \(.doi)\n- record: \(.url)\n- manifest: \(.manifest_sha256)\n- files: \(.files | length), every checksum matched"' /tmp/record.json; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 'Hugging Face - a private dataset repository, every file read back and compared, then deleted'
        if: always()
        env:
          DEPOSIT_TOKEN: ${{ secrets.HF_TOKEN }}
          PACK: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          node verify/cli.mjs huggingface "packs/$PACK" "rehearsal-${{ github.run_id }}" rehearsal "https://github.com/${{ github.repository }}" > /tmp/hf.json
          [ "$(jq -r .deleted /tmp/hf.json)" = true ] && [ "$(jq -r .manifest_sha256 /tmp/hf.json)" = "$(node verify/cli.mjs digest "packs/$PACK/manifest.json")" ]
          { echo '### Hugging Face rehearsal (private repository, deleted)'; jq -r '"- files read back and equal: \(.files | length)\n- manifest: \(.manifest_sha256)\n- repository deleted: \(.deleted)"' /tmp/hf.json; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 'OSF - a private project, a file uploaded, its SHA-256 compared, then deleted'
        # Tried even when the step before failed: each rehearsal is read on its own.
        if: always()
        env:
          DEPOSIT_TOKEN: ${{ secrets.OSF_TOKEN }}
        run: |
          set -euo pipefail
          printf '# Rehearsal\n\nRun %s. Not a protocol.\n' "${{ github.run_id }}" > /tmp/protocol.md
          node verify/cli.mjs osf /tmp/protocol.md "NEO AI Evaluations - rehearsal ${{ github.run_id }}" rehearsal > /tmp/osf.json
          [ "$(jq -r .deleted /tmp/osf.json)" = true ] && [ "$(jq -r .sha256 /tmp/osf.json)" = "$(sha256sum /tmp/protocol.md | cut -d' ' -f1)" ]
          { echo '### OSF rehearsal (private project, deleted)'; jq -r '"- SHA-256 computed by OSF equals ours: \(.sha256)\n- project deleted: \(.deleted)"' /tmp/osf.json; } | tee -a "$GITHUB_STEP_SUMMARY"
